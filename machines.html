<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Machines — GregTech Nightmare</title>
    <link rel="stylesheet" href="styles/base.css">
    <link rel="stylesheet" href="styles/machines.css">
</head>
<body>

<svg id="stars-canvas" width="100%" height="100%"></svg>

<div class="page-content">
    <h1 class="page-title">Machines</h1>

    <div class="tier-filters">
        <button class="tier-btn active" data-tier="all">All</button>
        <button class="tier-btn" data-tier="STEAM">Steam</button>
        <button class="tier-btn" data-tier="ULV">ULV</button>
        <button class="tier-btn" data-tier="LV">LV</button>
        <button class="tier-btn" data-tier="MV">MV</button>
        <button class="tier-btn" data-tier="HV">HV</button>
        <button class="tier-btn" data-tier="EV">EV</button>
        <button class="tier-btn" data-tier="IV">IV</button>
        <button class="tier-btn" data-tier="LUV">LUV</button>
        <button class="tier-btn" data-tier="ZPM">ZPM</button>
        <button class="tier-btn" data-tier="UV">UV</button>
        <button class="tier-btn" data-tier="UHV">UHV</button>
        <button class="tier-btn" data-tier="UEV">UEV</button>
        <button class="tier-btn" data-tier="UIV">UIV</button>
        <button class="tier-btn" data-tier="UMV">UMV</button>
        <button class="tier-btn" data-tier="UXV">UXV</button>
        <button class="tier-btn" data-tier="MAX">MAX</button>
    </div>

    <div id="machines-grid" class="machines-grid"></div>

    <a href="index.html" class="back-btn">← Back</a>
</div>

<div id="machine-modal" class="modal">
    <div class="modal-overlay"></div>
    <div class="modal-content">
        <button class="modal-close">&times;</button>
        <h2 id="modal-title" class="modal-title"></h2>
        <div id="modal-images" class="modal-images"></div>
        <p id="modal-description" class="modal-description"></p>
    </div>
</div>

<script src="scripts/stars.js"></script>
<script src="scripts/machines.js"></script>
</body>
</html>
